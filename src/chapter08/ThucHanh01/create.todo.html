<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành 01</title>
</head>

<body>
    <h1>Tạo ứng dụng todo list, kết hợp lưu trữ data với LocalStorage</h1>
    <!-- tạo form html để tạo mới todo, bao gồm:
        - input text để nhập nội dung todo
        - button để submit form 
    -->
    <form id="todoForm">
        <label for="todo">Nội dung todo:</label>
        <input type="text" id="todo" name="todo" required>
        <button type="submit">Thêm todo</button>
    </form>

</body>

</html>
